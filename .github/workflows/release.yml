name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm clean-install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Release
        # Auto-publishes to npm via semantic-release on every push to main, the
        # same way sogni-client releases. Restored 2026-08-24: the previous
        # publish-type token failed with EOTP because npm 2FA is enabled on the
        # package, so it had been removed from repo secrets and maintainers
        # published by hand. The NPM_TOKEN secret now holds a granular token
        # with "Bypass two-factor authentication (2FA)" enabled — npm's
        # replacement for the retired Classic/Automation type — which is the
        # token type CI requires.
        #
        # If this starts failing with E401/EINVALIDNPMTOKEN, the token expired
        # (npm caps write tokens at 90 days); mint a new one the same way rather
        # than routing around CI. npm is deprecating 2FA-bypass tokens, so the
        # durable fix is migrating this step to Trusted Publishing (OIDC).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
