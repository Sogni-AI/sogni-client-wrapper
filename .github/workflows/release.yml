name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm clean-install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Release
        # Auto-publish to npm via semantic-release is gated behind a manual
        # workflow_dispatch trigger AND currently has no NPM_TOKEN configured.
        # npm 2FA is enabled on the package, so the prior publish-type token
        # always failed with EOTP and was removed from repo secrets to avoid
        # confusion. Maintainers publish manually (npm version + npm publish
        # --otp=...) for now.
        #
        # To re-enable CI publishing: generate an npm Automation token (npm
        # web UI → Access Tokens → Generate New → Classic → Automation), add
        # it to repo secrets as NPM_TOKEN, re-add the `NPM_TOKEN: ${{
        # secrets.NPM_TOKEN }}` env entry below, and drop the
        # `workflow_dispatch`-only guard if you want per-push publishes back.
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
